[package]
name = "sennheiser-controls-gui"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Desktop app to control ANC, EQ, and other settings on Sonova/Sennheiser headphones"
license = "GPL-3.0-or-later"
repository = "https://github.com/jeffsmith82/sennheiser-controls"
authors = ["jeffsmith82 <jeffrey_smith@hotmail.co.uk>"]

[[bin]]
name = "sennheiser-controls-gui"
path = "src/main.rs"

[dependencies]
sennheiser-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
# Slint's default "accessibility" feature pulls in atspi-common, which uses
# a #[validate(...)] proc-macro (zbus_lockstep_macros) that connects to a
# live D-Bus session bus at COMPILE time to check signal signatures against
# real introspection data. That works on an ordinary desktop but fails
# (silently corrupting the macro expansion into "cannot find type ObjectRef"
# errors) in a sandboxed build with no session bus, like a Flatpak build -
# confirmed live: the same crate compiled fine locally, in both debug and
# release, and only failed inside flatpak-builder. Disabling just this one
# default feature avoids the whole chain; nothing else here uses it.
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    "system-tray",
] }

[build-dependencies]
slint-build = "1"

# For `cargo deb` (see .github/workflows/release.yml). "$auto" shared-library
# dependency detection needs dpkg-dev's tools, present on the Ubuntu CI
# runner this actually gets built on.
[package.metadata.deb]
name = "sennheiser-controls-gui"
depends = "$auto"
section = "sound"
assets = [
    ["target/release/sennheiser-controls-gui", "usr/bin/", "755"],
    ["../flatpak/io.github.jeffreysmith.SennheiserControls.desktop", "usr/share/applications/", "644"],
    ["../flatpak/io.github.jeffreysmith.SennheiserControls.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

# For `cargo generate-rpm` (see .github/workflows/release.yml).
[package.metadata.generate-rpm]
name = "sennheiser-controls-gui"
assets = [
    { source = "target/release/sennheiser-controls-gui", dest = "/usr/bin/sennheiser-controls-gui", mode = "755" },
    { source = "../flatpak/io.github.jeffreysmith.SennheiserControls.desktop", dest = "/usr/share/applications/io.github.jeffreysmith.SennheiserControls.desktop", mode = "644" },
    { source = "../flatpak/io.github.jeffreysmith.SennheiserControls.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.jeffreysmith.SennheiserControls.svg", mode = "644" },
]
